<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Mi Música</title>
<style>
:root{--bg:#0b0b10;--panel:#14141c;--card:#1a1a24;--hover:#232331;--txt:#f2f2f5;--mut:#9a9aab;--acc:#1ed760;--acc2:#b48cff;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:1fr auto;height:100vh;height:100dvh}
aside{background:#000;padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.logo{font-weight:800;font-size:1.3rem;padding:0 10px 18px;letter-spacing:.3px}
.logo span{color:var(--acc)}
.nav{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:10px;color:var(--mut);font-weight:600;transition:.2s}
.nav:hover{color:var(--txt)}
.nav.on{color:var(--txt);background:var(--panel)}
.nav svg{width:22px;height:22px;fill:currentColor}
main{overflow-y:auto;background:linear-gradient(180deg,#1d1830 0,var(--bg) 340px);padding:26px 28px 40px;scroll-behavior:smooth}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:1.9rem;font-weight:800;margin-bottom:6px}
h2{font-size:1.25rem;font-weight:700;margin:28px 0 14px;display:flex;justify-content:space-between;align-items:center}
.sub{color:var(--mut);font-size:.92rem}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:180px;gap:16px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.row::-webkit-scrollbar{height:6px}.row::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);padding:12px;transition:.25s;position:relative;scroll-snap-align:start;cursor:pointer}
.card:hover{background:var(--hover);transform:translateY(-3px)}
.cover{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;margin-bottom:10px;background:#222;box-shadow:0 8px 24px #0007}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .mosaic{display:grid;grid-template-columns:1fr 1fr;height:100%}
.cover .mosaic img{aspect-ratio:1}
.cover .tag{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-weight:800;font-size:1rem;background:linear-gradient(transparent,#000c);text-shadow:0 1px 4px #000}
.fab{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--acc);color:#000;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.25s;box-shadow:0 6px 16px #0008}
.card:hover .fab{opacity:1;transform:none}
.fab svg{width:20px;height:20px;fill:#000}
.ct{font-weight:700;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{color:var(--mut);font-size:.8rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add2{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;background:#000a;display:grid;place-items:center;opacity:0;transition:.2s;font-size:1.1rem}
.card:hover .add2{opacity:1}
.btn{background:var(--acc);color:#000;font-weight:700;padding:11px 20px;border-radius:999px;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:scale(1.04)}
.btn.sec{background:transparent;color:var(--txt);border:1px solid #444}
.btn.sm{padding:7px 14px;font-size:.85rem}
.search{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.search input,.field{flex:1;min-width:220px;padding:13px 18px;border-radius:999px;border:1px solid #2c2c3a;background:var(--panel);color:var(--txt);font-size:.95rem;outline:none;transition:.2s}
.search input:focus,.field:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid #2c2c3a;font-weight:600;font-size:.9rem;transition:.2s}
.chip:hover{border-color:#555}
.chip.on{background:var(--acc);color:#000;border-color:var(--acc)}
.genre{border-radius:var(--r);padding:16px;height:110px;font-weight:800;font-size:1.1rem;position:relative;overflow:hidden;transition:.25s;cursor:pointer}
.genre:hover{transform:scale(1.03)}
.genre img{position:absolute;right:-14px;bottom:-8px;width:90px;transform:rotate(22deg);border-radius:6px;box-shadow:0 4px 12px #0008}
.list{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:28px 48px 1fr auto auto;gap:12px;align-items:center;padding:7px 10px;border-radius:8px;transition:.15s;cursor:pointer}
.tr:hover{background:var(--hover)}
.tr .n{color:var(--mut);text-align:center;font-size:.85rem}
.tr img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.tr .tt{min-width:0}.tr .tt b{display:block;font-weight:600;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .tt small{color:var(--mut);font-size:.8rem}
.tr.act b{color:var(--acc)}
.tr .ib{color:var(--mut);padding:6px 8px;border-radius:6px;font-size:1rem}
.tr .ib:hover{color:var(--txt);background:#333}
.tr .du{color:var(--mut);font-size:.82rem}
.hero{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.hero .cover{width:170px;margin:0}
.pltabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.empty{color:var(--mut);padding:30px 0;text-align:center}
/* bar */
.bar{grid-column:1/-1;background:#000;border-top:1px solid #1d1d26;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:16px;padding:10px 18px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.np{display:flex;align-items:center;gap:12px;min-width:0}
#pbox{width:112px;height:63px;border-radius:8px;overflow:hidden;background:#111;flex-shrink:0}
#pbox iframe{width:100%;height:100%;display:block}
.np .tt{min-width:0}.np b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np small{color:var(--mut);font-size:.78rem}
.ctr{display:flex;flex-direction:column;align-items:center;gap:6px}
.cb{display:flex;align-items:center;gap:14px}
.cb button{color:var(--mut);width:36px;height:36px;display:grid;place-items:center;border-radius:50%;transition:.15s}
.cb button:hover{color:var(--txt)}
.cb button svg{width:20px;height:20px;fill:currentColor}
.cb button.on{color:var(--acc)}
.cb #play{background:var(--txt);color:#000;width:42px;height:42px}
.cb #play:hover{transform:scale(1.07)}
.prog{display:flex;align-items:center;gap:8px;width:100%;font-size:.72rem;color:var(--mut)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(var(--acc),var(--acc)) 0/var(--p,0%) 100% no-repeat #3a3a46;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:none}
.vol{display:flex;align-items:center;gap:8px;justify-content:flex-end;color:var(--mut)}
.vol input{max-width:120px}
/* modal */
.modal{position:fixed;inset:0;background:#000c;backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex;animation:fade .3s}
.mbox{background:var(--panel);border-radius:20px;padding:26px;max-width:720px;width:100%;max-height:90vh;overflow-y:auto}
.mbox h3{margin:20px 0 12px;font-size:1rem;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--acc);color:#000;font-weight:700;padding:10px 20px;border-radius:999px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.menu{position:fixed;background:#282834;border-radius:10px;padding:6px;z-index:70;box-shadow:0 10px 30px #000a;min-width:190px;display:none}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:6px;font-size:.9rem}
.menu button:hover{background:#3a3a48}
/* mobile */
@media(max-width:760px){
 .app{grid-template-columns:1fr;grid-template-rows:1fr auto auto}
 aside{grid-row:3;flex-direction:row;justify-content:space-around;padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom));border-top:1px solid #1d1d26}
 .logo{display:none}
 .nav{flex-direction:column;gap:3px;font-size:.68rem;padding:6px 8px;background:none!important}
 .nav.on{color:var(--acc)}
 main{padding:18px 16px 30px}
 h1{font-size:1.5rem}
 .bar{grid-row:2;grid-template-columns:1fr auto;padding:8px 12px;gap:10px}
 .ctr{display:contents}
 .prog{grid-column:1/-1;order:3}
 .vol{display:none}
 #pbox{width:88px;height:50px}
 .cb{gap:2px}.cb .hm{display:none}
 .row{grid-auto-columns:150px}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}
 .fab,.add2{opacity:1;transform:none}
 .fab{width:38px;height:38px}
 .tr{grid-template-columns:42px 1fr auto;gap:10px}.tr .n,.tr .du{display:none}.tr img{width:42px;height:42px}
 .toast{bottom:170px}
}
</style>
</head>

function vInicio(){let h=`<h1>${greet()} 👋</h1><p class="sub">Tu música de YouTube, a tu gusto.</p>`;
 if(!likes||(!likes.genres.length&&!likes.artists.length)){
  h+=`<h2>Empieza aquí</h2><p class="sub" style="margin-bottom:14px">Elige tus géneros y artistas favoritos y te armo mixes personalizados.</p><button class="btn" onclick="onboard()">Elegir mis gustos</button>`;
  h+=`<h2>Populares</h2><div class="row">${CAT.genres.map(g=>mixCard(mix('Lo mejor de '+g.name,'Mix de '+g.name,shuf(CAT.songs.filter(s=>s.g===g.id)).slice(0,25),g.color))).join('')}</div>`;return h}
 const fav=CAT.songs.filter(s=>likes.artists.includes(s.a)||likes.genres.includes(s.g));
 h+=`<h2>Para ti <button class="btn sm" onclick="playList(shuf(window._fav))">${PLAYSVG.replace('<svg','<svg width=16 height=16')} Reproducir todo</button></h2>`;window._fav=fav;
 const pt=[mix('Tu Mix Diario','Lo que más te gusta',shuf(fav).slice(0,30),'#1ed760')];
 likes.artists.forEach(a=>{const ar=ARTISTS[a];if(!ar)return;const rel=shuf(CAT.songs.filter(s=>s.g===ar.g&&s.a!==a)).slice(0,8);pt.push(mix('Mix '+a,a+' y similares',shuf(ar.songs).concat(rel),G[ar.g].color))});
 likes.genres.forEach(g=>pt.push(mix('Radio '+G[g].name,'Lo mejor de '+G[g].name,shuf(CAT.songs.filter(s=>s.g===g)),G[g].color)));
 h+=`<div class="row">${pt.map(mixCard).join('')}</div>`;
 const mine=new Set(likes.genres.concat(likes.artists.map(a=>ARTISTS[a]&&ARTISTS[a].g)));
 let rel=new Set();mine.forEach(g=>G[g]&&G[g].related.forEach(r=>{if(!mine.has(r))rel.add(r)}));
 if(!rel.size)CAT.genres.forEach(g=>{if(!mine.has(g.id))rel.add(g.id)});
 const disc=[...rel].map(g=>mix('Descubre '+G[g].name,'Porque te gusta '+([...mine].filter(x=>G[x]&&G[x].related.includes(g)).map(x=>G[x].name)[0]||'la buena música'),shuf(CAT.songs.filter(s=>s.g===g)).slice(0,20),G[g].color));
 h+=`<h2>Descubre</h2><div class="row">${disc.map(mixCard).join('')}</div>`;
 const ds=shuf(CAT.songs.filter(s=>rel.has(s.g))).slice(0,12);
 h+=`<h2>Canciones que te pueden gustar</h2><div class="row">${ds.map(songCard).join('')}</div>`;
 const fs=shuf(fav).slice(0,12);
 h+=`<h2>Tus favoritas</h2><div class="row">${fs.map(songCard).join('')}</div>`;return h}
function linkBox(){return `<div class="search"><input id="inp" placeholder="Pega un enlace de YouTube o escribe para buscar…" onkeydown="if(event.key==='Enter')addLink()"><button class="btn" onclick="addLink()">Agregar</button><button class="btn sec" onclick="ytSearch()">Buscar en YouTube ↗</button></div>`}
function vExplorar(){if(sub&&sub.g)return vGenre(sub.g);if(sub&&sub.a)return vArtist(sub.a);
 let h=`<h1>Explorar</h1><p class="sub">Pega un enlace de YouTube para agregarlo a "${esc(curPl)}", o busca en YouTube.</p>`+linkBox();
 h+=`<h2>Géneros</h2><div class="grid">${CAT.genres.map(g=>{const s=CAT.songs.find(x=>x.g===g.id);return `<div class="genre" style="background:${g.color}" data-g="${g.id}">${esc(g.name)}<img src="${thumb(s.id)}" alt=""></div>`}).join('')}</div>`;
 h+=`<h2>Artistas</h2><div class="grid">${Object.values(ARTISTS).map(artistCard).join('')}</div>`;return h}
function artistCard(a){return `<div class="card" data-ar="${esc(a.name)}"><div class="cover" style="border-radius:50%"><img src="${thumb(a.songs[0].id)}" loading="lazy" alt=""></div><div class="ct" style="text-align:center">${esc(a.name)}</div><div class="cs" style="text-align:center">${esc(G[a.g].name)}</div></div>`}
function back(){return `<button class="btn sec sm" style="margin-bottom:16px" onclick="sub=null;render()">← Volver</button>`}
function trackList(songs,opts={}){if(!songs.length)return '<div class="empty">No hay canciones aquí todavía.</div>';window._tl=songs;
 return `<div class="list">${songs.map((s,i)=>`<div class="tr ${queue[qi]&&queue[qi].id===s.id?'act':''}" data-ti="${i}"><span class="n">${i+1}</span><img src="${thumb(s.id)}" loading="lazy" alt=""><div class="tt"><b>${esc(clean(s.t))}</b><small>${esc(s.a)}</small></div><span class="du">${s.d?fmt(s.d):''}</span><div>${opts.del?`<button class="ib" data-del="${i}" title="Quitar">✕</button>`:`<button class="ib" data-as="${s.id}" title="Agregar a mi lista">＋</button>`}</div></div>`).join('')}</div>`}
function vGenre(g){const songs=CAT.songs.filter(s=>s.g===g),ar=Object.values(ARTISTS).filter(a=>a.g===g);window._cur=songs;
 return back()+`<div class="hero"><div class="cover" style="background:${G[g].color}"><div class="mosaic">${songs.slice(0,4).map(s=>`<img src="${thumb(s.id)}">`).join('')}</div></div><div><p class="sub">Género</p><h1>${esc(G[g].name)}</h1><p class="sub">${songs.length} canciones</p><div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn" onclick="playList(window._cur)">${PLAYSVG.replace('<svg','<svg width=16 height=16')} Reproducir</button><button class="btn sec" onclick="playList(shuf(window._cur))">🔀 Aleatorio</button><button class="btn sec" onclick="addMany(window._cur)">＋ Agregar a mi lista</button></div></div></div>`+
 `<h2>Artistas</h2><div class="row">${ar.map(artistCard).join('')}</div><h2>Canciones</h2>`+trackList(songs)}
function vArtist(a){const ar=ARTISTS[a];window._cur=ar.songs;const liked=likes&&likes.artists.includes(a);
 return back()+`<div class="hero"><div class="cover" style="border-radius:50%"><img src="${thumb(ar.songs[0].id)}"></div><div><p class="sub">Artista · ${esc(G[ar.g].name)}</p><h1>${esc(a)}</h1><div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn" onclick="playList(window._cur)">${PLAYSVG.replace('<svg','<svg width=16 height=16')} Reproducir</button><button class="btn sec" onclick="toggleArtist('${esc(a).replace(/'/g,"\\'")}')">${liked?'♥ Te gusta':'♡ Me gusta'}</button><button class="btn sec" onclick="addMany(window._cur)">＋ Agregar a mi lista</button></div></div></div><h2>Canciones</h2>`+trackList(ar.songs)}
function chipsHTML(){const l=likes||{genres:[],artists:[]};
 return `<h3>Géneros</h3><div class="chips">${CAT.genres.map(g=>`<button class="chip ${l.genres.includes(g.id)?'on':''}" data-cg="${g.id}">${esc(g.name)}</button>`).join('')}</div>
 <h3>Artistas</h3><div class="chips">${Object.values(ARTISTS).map(a=>`<button class="chip ${l.artists.includes(a.name)?'on':''}" data-ca="${esc(a.name)}">${esc(a.name)}</button>`).join('')}</div>`}
function vGustos(){return `<h1>Mis gustos</h1><p class="sub">Toca para elegir lo que te gusta. Con esto armo tus mixes en Inicio.</p><div id="chipsArea">${chipsHTML()}</div><div style="margin-top:26px"><button class="btn" onclick="view='inicio';render()">Ver mis mixes</button></div>`}
function vLista(){const names=Object.keys(pls),songs=pls[curPl]||[];window._cur=songs;
 return `<h1>Mis listas</h1><div class="pltabs">${names.map(n=>`<button class="chip ${n===curPl?'on':''}" data-pl="${esc(n)}">${esc(n)} · ${pls[n].length}</button>`).join('')}<button class="chip" onclick="newPl()">＋ Nueva lista</button></div>
 <div class="hero" style="margin-top:10px"><div class="cover">${songs.length?`<div class="mosaic">${songs.slice(0,4).map(s=>`<img src="${thumb(s.id)}">`).join('')}</div>`:'<div style="display:grid;place-items:center;height:100%;font-size:3rem">🎵</div>'}</div><div><p class="sub">Lista</p><h1>${esc(curPl)}</h1><p class="sub">${songs.length} canciones</p><div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn" onclick="playList(window._cur)">${PLAYSVG.replace('<svg','<svg width=16 height=16')} Reproducir</button><button class="btn sec" onclick="playList(shuf(window._cur))">🔀</button><button class="btn sec sm" onclick="renPl()">Renombrar</button><button class="btn sec sm" onclick="delPl()">Eliminar lista</button></div></div></div>`+linkBox()+trackList(songs,{del:true})}
// ---------- actions ----------
function onboard(){$('mbox').innerHTML=`<h1>¿Qué te gusta escuchar? 🎶</h1><p class="sub">Elige géneros y artistas. Puedes cambiarlo cuando quieras en "Mis gustos".</p><div id="chipsArea">${chipsHTML()}</div><div style="margin-top:24px;display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" onclick="closeM()">Ahora no</button><button class="btn" onclick="closeM();view='inicio';render()">Listo</button></div>`;$('modal').classList.add('show');if(!likes){likes={genres:[],artists:[]};saveL()}}
function closeM(){$('modal').classList.remove('show')}
function saveL(){LS.setItem('mm_likes',JSON.stringify(likes))}
function toggleArtist(a){likes=likes||{genres:[],artists:[]};const i=likes.artists.indexOf(a);i<0?likes.artists.push(a):likes.artists.splice(i,1);saveL();render()}
function addTo(name,songs){let n=0;songs.forEach(s=>{if(!pls[name].some(x=>x.id===s.id)){pls[name].push({id:s.id,t:s.t,a:s.a,d:s.d});n++}});saveP();toast(n?`${n} agregada${n>1?'s':''} a "${name}"`:'Ya estaba en "'+name+'"');if(view==='lista')render()}
function addMany(songs,ev){const names=Object.keys(pls);if(names.length===1){addTo(names[0],songs);return}
 const m=$('menu');m.innerHTML='<div class="sub" style="padding:6px 12px">Agregar a…</div>'+names.map(n=>`<button data-to="${esc(n)}">${esc(n)}</button>`).join('');m._songs=songs;
 const e=window.event||ev;const x=Math.min((e&&e.clientX)||innerWidth/2,innerWidth-210),y=Math.min((e&&e.clientY)||innerHeight/2,innerHeight-50*names.length-60);m.style.left=x+'px';m.style.top=Math.max(10,y)+'px';m.style.display='block'}
function newPl(){const n=(prompt('Nombre de la nueva lista:')||'').trim();if(!n)return;if(pls[n]){toast('Ya existe esa lista');return}pls[n]=[];curPl=n;saveP();render()}
function renPl(){const n=(prompt('Nuevo nombre:',curPl)||'').trim();if(!n||n===curPl||pls[n])return;const o={};for(const k in pls)o[k===curPl?n:k]=pls[k];pls=o;curPl=n;saveP();render()}
function delPl(){if(Object.keys(pls).length===1){pls[curPl]=[];}else{if(!confirm('¿Eliminar la lista "'+curPl+'"?'))return;delete pls[curPl];curPl=Object.keys(pls)[0]}saveP();render()}
function getId(s){s=s.trim();if(/^[\w-]{11}$/.test(s))return s;const m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);return m?m[1]:null}
async function addLink(){const v=$('inp').value;if(!v.trim())return;const id=getId(v);if(!id){ytSearch();return}
 let t=id,a='YouTube';try{const r=await fetch('https://www.youtube.com/oembed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id)+'&format=json');if(r.ok){const j=await r.json();t=j.title||id;a=j.author_name||a}}catch(e){}
 $('inp').value='';addTo(curPl,[{id,t,a}])}
function ytSearch(){const q=($('inp')&&$('inp').value.trim())||'';window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank','noopener')}
// ---------- player ----------
function playList(songs,start=0){if(!songs||!songs.length)return;queue=songs.slice();playAt(start)}
function playAt(i){qi=i;const s=queue[i];if(!s)return;$('npT').textContent=clean(s.t);$('npA').textContent=s.a;document.title=clean(s.t)+' · Mi Música';
 if(ready)player.loadVideoById(s.id);else pending=s.id;document.querySelectorAll('.tr').forEach(r=>{const t=window._tl&&window._tl[+r.dataset.ti];r.classList.toggle('act',!!t&&t.id===s.id)})}
function next(auto){if(!queue.length)return;if(auto&&repeat==='one'){playAt(qi);return}
 let n;if(shuffle&&queue.length>1){do n=Math.random()*queue.length|0;while(n===qi)}else n=qi+1;
 if(n>=queue.length){if(auto&&repeat!=='all'){player.stopVideo();return}n=0}playAt(n)}
function prev(){if(!queue.length)return;if(ready&&player.getCurrentTime()>3){player.seekTo(0,true);return}playAt((qi-1+queue.length)%queue.length)}
function setIcon(p){$('pico').innerHTML=p?'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>'}
function ui(){$('shuf').classList.toggle('on',shuffle);$('rep').classList.toggle('on',repeat!=='off');$('rep').title={off:'Repetir: no',all:'Repetir: todo',one:'Repetir: una'}[repeat];$('rep').style.position='relative';$('rep').dataset.one=repeat==='one';$('rep').innerHTML=$('rep').innerHTML.replace(/<b.*<\/b>/,'')+(repeat==='one'?'<b style="position:absolute;font-size:9px;top:4px;right:4px">1</b>':'')}
$('play').onclick=()=>{if(!ready)return;if(qi<0){const l=pls[curPl];if(l&&l.length)playList(l);else if(CAT.songs.length)playList(shuf(CAT.songs));return}player.getPlayerState()===1?player.pauseVideo():player.playVideo()};
$('next').onclick=()=>next(false);$('prev').onclick=prev;
$('shuf').onclick=()=>{shuffle=!shuffle;LS.setItem('mm_shuf',shuffle?'1':'0');ui();toast(shuffle?'Aleatorio activado':'Aleatorio desactivado')};
$('rep').onclick=()=>{repeat={off:'all',all:'one',one:'off'}[repeat];LS.setItem('mm_rep',repeat);ui();toast({off:'Repetir desactivado',all:'Repetir toda la lista',one:'Repetir una canción'}[repeat])};
const vol=$('vol');vol.value=LS.getItem('mm_vol')||80;const paint=r=>r.style.setProperty('--p',(r.value/r.max*100)+'%');paint(vol);
vol.oninput=()=>{paint(vol);LS.setItem('mm_vol',vol.value);if(ready)player.setVolume(+vol.value)};
const seek=$('seek');seek.oninput=()=>{seeking=true;paint(seek)};seek.onchange=()=>{seeking=false;if(ready)player.seekTo(player.getDuration()*seek.value/1000,true)};
setInterval(()=>{if(!ready||seeking||!player.getDuration)return;const c=player.getCurrentTime(),d=player.getDuration();$('cur').textContent=fmt(c);$('dur').textContent=fmt(d);seek.value=d?c/d*1000:0;paint(seek)},500);
const HTTP=/^https?:$/.test(location.protocol);
let errStreak=0;
const ERRS={2:'Enlace de video inválido',5:'Error del reproductor',100:'Video no disponible o eliminado',101:'El dueño no permite reproducirlo aquí',150:'El dueño no permite reproducirlo aquí',153:'YouTube bloqueó el reproductor'};
window.onYouTubeIframeAPIReady=()=>{const pv={playsinline:1,rel:0,modestbranding:1,enablejsapi:1};if(HTTP)pv.origin=location.origin;
 player=new YT.Player('player',{width:'100%',height:'100%',host:HTTP?'https://www.youtube-nocookie.com':'https://www.youtube.com',playerVars:pv,
 events:{onReady:()=>{ready=true;player.setVolume(+vol.value);if(pending){player.loadVideoById(pending);pending=null}},
 onStateChange:e=>{setIcon(e.data===1);if(e.data===1)errStreak=0;if(e.data===0)next(true)},
 onError:e=>{const s=queue[qi];toast((ERRS[e.data]||'No se pudo reproducir')+' · saltando');
  if(!HTTP&&(e.data===153||e.data===150||e.data===101)&&errStreak===0)setTimeout(()=>toast('Abre la página desde su enlace web (https), no como archivo'),2200);
  if(++errStreak>=Math.min(queue.length,5)){toast('No se pudo reproducir ninguna canción. Revisa tu conexión.');errStreak=0;return}
  setTimeout(()=>next(true),1200)}}})};
setTimeout(()=>{if(!window.YT||!window.YT.Player)toast('No cargó YouTube. Revisa tu internet o desactiva el bloqueador de anuncios.')},8000);
if(!HTTP)setTimeout(()=>toast('Consejo: abre la página desde su enlace https para que YouTube funcione'),1500);
// ---------- events ----------
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{view=n.dataset.v;sub=null;render()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-pm],[data-am],[data-ps],[data-as],[data-mix],[data-song],[data-g],[data-ar],[data-ti],[data-del],[data-pl],[data-cg],[data-ca],[data-to]');
 const menu=$('menu');if(!e.target.closest('#menu')&&!(t&&(t.dataset.am||t.dataset.as)))menu.style.display='none';
 if(e.target===$('modal'))closeM();if(!t)return;const d=t.dataset;e.stopPropagation();
 if(d.pm){playList(MIX[d.pm].songs)}else if(d.am){addMany(MIX[d.am].songs,e)}
 else if(d.ps){playList([findSong(d.ps)])}else if(d.as){addMany([findSong(d.as)],e)}
 else if(d.mix){playList(MIX[d.mix].songs)}
 else if(d.song){const s=findSong(d.song),rel=shuf(CAT.songs.filter(x=>x.g===s.g&&x.id!==s.id)).slice(0,15);playList([s].concat(rel))}
 else if(d.g){view='explorar';sub={g:d.g};render()}else if(d.ar){view='explorar';sub={a:d.ar};render()}
 else if(d.del!==undefined){pls[curPl].splice(+d.del,1);saveP();render()}
 else if(d.ti!==undefined){playList(window._tl,+d.ti)}
 else if(d.pl){curPl=d.pl;saveP();render()}
 else if(d.to){addTo(d.to,menu._songs);menu.style.display='none'}
 else if(d.cg||d.ca){likes=likes||{genres:[],artists:[]};const arr=d.cg?likes.genres:likes.artists,v=d.cg||d.ca,i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);saveL();t.classList.toggle('on')}
});
ui();render();if(!likes)setTimeout(onboard,400);
</script>
<script src="https://www.youtube.com/iframe_api" onerror="toast('No se pudo cargar YouTube. Revisa tu conexión o el bloqueador de anuncios.')"></script>
</body>
</html>
